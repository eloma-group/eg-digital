<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" role="img" aria-label="Google search, social media and AI channels converging on one brand">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#0d2f52"/>
      <stop offset="60%" stop-color="#0a2745"/>
      <stop offset="100%" stop-color="#08213C"/>
    </radialGradient>
    <radialGradient id="node" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#57d3a6"/>
      <stop offset="100%" stop-color="#3CB98C"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tileGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1680" height="720" fill="url(#bg)"/>

  <!-- Ambient decorative dots -->
  <g fill="#3CB98C" opacity="0.16">
    <circle cx="180" cy="130" r="5"/>
    <circle cx="1520" cy="180" r="6"/>
    <circle cx="1420" cy="560" r="5"/>
    <circle cx="250" cy="600" r="6"/>
    <circle cx="120" cy="360" r="4"/>
    <circle cx="1560" cy="380" r="4"/>
  </g>

  <!-- Connectors (dotted) from each channel to the central brand -->
  <g stroke="#3CB98C" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 20" opacity="0.65">
    <line x1="840" y1="150" x2="840" y2="300"/>
    <line x1="512" y1="576" x2="792" y2="392"/>
    <line x1="1168" y1="576" x2="888" y2="392"/>
  </g>

  <!-- Central brand node -->
  <circle cx="840" cy="360" r="128" fill="#3CB98C" opacity="0.28" filter="url(#soft)"/>
  <circle cx="840" cy="360" r="104" fill="url(#node)"/>
  <circle cx="840" cy="360" r="104" fill="none" stroke="#f8f8ff" stroke-width="3" opacity="0.5"/>
  <!-- Storefront / "three doors into the same house" -->
  <g>
    <polygon points="770,362 840,300 910,362" fill="#f8f8ff"/>
    <rect x="786" y="362" width="108" height="82" rx="6" fill="#f8f8ff"/>
    <rect x="822" y="392" width="36" height="52" rx="5" fill="#08213C"/>
    <circle cx="850" cy="418" r="3.4" fill="#3CB98C"/>
  </g>

  <!-- AI chat channel (top) -->
  <g filter="url(#tileGlow)">
    <rect x="765" y="24" width="150" height="150" rx="34" fill="#0d2f52" stroke="#3CB98C" stroke-width="4"/>
  </g>
  <g>
    <rect x="795" y="66" width="90" height="58" rx="18" fill="#3CB98C"/>
    <polygon points="812,120 812,146 838,120" fill="#3CB98C"/>
    <circle cx="820" cy="95" r="6" fill="#f8f8ff"/>
    <circle cx="840" cy="95" r="6" fill="#f8f8ff"/>
    <circle cx="860" cy="95" r="6" fill="#f8f8ff"/>
  </g>

  <!-- Google search channel (bottom-left) -->
  <g filter="url(#tileGlow)">
    <rect x="395" y="535" width="150" height="150" rx="34" fill="#0d2f52" stroke="#3CB98C" stroke-width="4"/>
  </g>
  <g fill="none" stroke="#3CB98C" stroke-linecap="round">
    <circle cx="458" cy="598" r="30" stroke-width="12"/>
    <line x1="480" y1="620" x2="505" y2="645" stroke-width="14"/>
  </g>

  <!-- Social media channel (bottom-right) -->
  <g filter="url(#tileGlow)">
    <rect x="1135" y="535" width="150" height="150" rx="34" fill="#0d2f52" stroke="#3CB98C" stroke-width="4"/>
  </g>
  <g>
    <rect x="1183" y="556" width="60" height="108" rx="14" fill="none" stroke="#3CB98C" stroke-width="8"/>
    <path d="M1213 640 c-22 -14 -32 -30 -20 -44 c8 -9 20 -6 20 4 c0 -10 12 -13 20 -4 c12 14 2 30 -20 44 z" fill="#3CB98C"/>
    <circle cx="1213" cy="571" r="3.4" fill="#3CB98C"/>
  </g>
</svg>
